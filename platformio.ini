; Climate controller: DHT sensor, infrared air conditioner control, fan relay,
; configured through a Secure Shell server running on the ESP32.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Pass terminal control codes through: the console redraws its prompt with them.
monitor_filters = direct
board_build.filesystem = littlefs
; No over-the-air updates (firmware is only flashed over USB), so a single 3 MB
; application slot and a larger filesystem for infrared codes.
board_build.partitions = huge_app.csv
; libssh buffers a whole incoming packet before checking it, and a client that has not
; logged in can announce 256 KB, more than the ESP32's free memory. 64 KB is still far
; above the 35000 bytes the SSH standard (RFC 4253) requires.
build_flags = -DMAX_PACKET_LEN=65536
lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    ewpa/LibSSH-ESP32 @ ^5.9.0

